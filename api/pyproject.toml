[project]
name = "pharmatwin"
version = "0.1.0"
description = "PharmaTwin demo: pharma supply-chain risk simulation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "numpy>=2.1",
  "ortools>=9.11",
  "httpx>=0.28",
  "openai>=1.57",
  "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.120",
  "mypy>=1.13",
  "ruff>=0.8",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pharmatwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["pharmatwin", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["pharmatwin.engine"]
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["ortools.*", "numpy.*"]
ignore_missing_imports = true
